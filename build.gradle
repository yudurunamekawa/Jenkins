plugins {
    id 'java'
    id 'checkstyle'
    id 'jacoco'
    id 'war'
    id 'maven-publish'
}

sourceCompatibility = 17
targetCompatibility = 17

group = 'jp.gihyo.jenkinsbook'
version = '1.0.0'

ext {
    artifactId = 'sampleproject'
}

repositories {
    mavenCentral()
}

dependencies {
    providedCompile 'javax.servlet:javax.servlet-api:3.1.0',
                    'javax.servlet.jsp:javax.servlet.jsp-api:2.3.1'

    testCompile 'junit:junit:4.12',
                'org.easymock:easymock:3.4'

    checkstyle 'com.puppycrawl.tools:checkstyle:6.11.2'
}

checkstyle {
    toolVersion = "6.11.2"
}

checkstyleMain {
    configFile = file('./config/checkstyle/sun_checks.xml')
    ignoreFailures = true
}

checkstyleTest {
    configFile = file('./config/checkstyle/sun_checks.xml')
    excludes = ['**/*']
}

jacoco {
    toolVersion = "0.8.12"
}

test {
    ignoreFailures = true
}

war {
    dependsOn check
    baseName = project.ext.artifactId
}

task wrapper(type: Wrapper) {
    gradleVersion = '8.7'
}

/* ★★★ ここから新しい Nexus deploy 設定 ★★★ */

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.web
            groupId = 'jp.gihyo.jenkinsbook'
            artifactId = 'sampleproject'
            version = '1.0.0'
        }
    }

    repositories {
        maven {
            url = uri("http://192.168.0.5:8081/repository/releases/")
            credentials {
                username = "admin"
                password = "ynamekawa"   // 推さんが Nexus にログインしているパスワード
            }
        }
    }
}
